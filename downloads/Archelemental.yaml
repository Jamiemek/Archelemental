# An example options file for Archelemental. Change the name, then put it in your Archipelago Players folder.
name: YourName
game: Archelemental
Archelemental:
  # goal: how many of the 118 elements, joke elements and compound achievements you need to finish
  elements_required: 118
  jokes_required: 0
  achievements_required: 0
  # game modes
  # (WIP, expect some bugs) Element Frenzy: the elements on the table are items. Rolling one is still a check, but you only get it by receiving it
  element_frenzy: false
  # (WIP, expect some bugs) Ionization Frenzy: every ion tier (+1 to +3, -1 to -3) of every element is a check
  ionization_frenzy: false
  # joke elements as checks, and the Joke Table Unlock item that lets you roll them
  joke_elements: true
  # one of each catalyst from your own shop is a check, up to this tier: none, common, uncommon, rare, epic, legendary, mythic
  catalyst_checks: epic
  # each of the 100 compound achievements is a check
  achievement_checks: false
  # parts of the game to keep. The bonds tree is over 2,600 checks
  bonds_tree: true
  shop: true
  events: true
  # how often the shop restocks, in minutes, before Progressive Shop Reset Speed
  restock_minutes: 18
  # luck only comes from these boosts (0 to 5 of each), with a minimum for the total
  luck_boosts_15: 5
  luck_boosts_30: 5
  luck_boosts_60: 5
  luck_boosts_90: 5
  minimum_luck_boosts: 8
  # how many rolls the logic will have you spend hunting one thing
  roll_budget: 5000
  # filler, trimmed or topped up to fit the number of checks
  catalyst_copies: 50
  bundles_100: 200
  bundles_1000: 100
  bundles_10000: 50
  bundles_100000: 10
  # traps replace filler (0 turns them off)
  roll_speed_traps: 0
  luck_traps: 0
  quark_drop_traps: 0
